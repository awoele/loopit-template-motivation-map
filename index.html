<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>模板策略方法样例｜公开版</title>
  <style>
    :root{color-scheme:dark;--bg:#101315;--panel:#191e21;--text:#f4f5f2;--muted:#9ba5a4;--line:#30383a;--accent:#ff6847}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 84% 8%,#39251f 0,transparent 30rem),var(--bg);color:var(--text);font:16px/1.65 Inter,"Microsoft YaHei",sans-serif}.wrap{width:min(100% - 40px,980px);margin:auto;padding:76px 0}.tag{color:var(--accent);font:700 12px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}h1{max-width:760px;margin:16px 0;font-size:clamp(42px,8vw,76px);line-height:1.04;letter-spacing:-.055em}.lead{max-width:700px;color:var(--muted);font-size:20px}.notice{margin:36px 0;padding:16px 18px;border:1px solid #70463d;background:#251c19;color:#ded4cf}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:40px}.card{min-height:220px;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.num{color:var(--accent);font:700 12px/1 ui-monospace,monospace}.card h2{margin:28px 0 10px;font-size:22px}.card p{margin:0;color:var(--muted)}footer{margin-top:70px;color:#71807e;font-size:13px;border-top:1px solid var(--line);padding-top:16px}@media(max-width:700px){.wrap{width:min(100% - 32px,980px);padding:48px 0}.grid{grid-template-columns:1fr}.lead{font-size:18px}}
  </style>
</head>
<body>
  <main class="wrap">
    <p class="tag">Public portfolio sample · 01</p>
    <h1>模板策略<br>方法样例</h1>
    <p class="lead">展示从用户动机、内容形式到体验链路的产品分析方法，不呈现真实模板、业务数据或上线表现。</p>
    <aside class="notice">公开作品集版本：分类、案例与描述均为抽象化示例，不对应任何真实业务、用户或内部决策。</aside>
    <section class="grid" aria-label="方法框架">
      <article class="card"><span class="num">01 / CONTEXT</span><h2>识别创作场景</h2><p>从使用者目标、表达成本和触发时机梳理问题空间。</p></article>
      <article class="card"><span class="num">02 / CONCEPT</span><h2>构建内容方向</h2><p>将洞察转化为可验证的主题、结构与互动假设。</p></article>
      <article class="card"><span class="num">03 / REVIEW</span><h2>形成迭代闭环</h2><p>以体验反馈与质量观察为依据，持续校准产品判断。</p></article>
    </section>
    <footer>公开版不含原始数据、项目编号、内部名称、素材或协作记录。</footer>
  </main>
</body>
